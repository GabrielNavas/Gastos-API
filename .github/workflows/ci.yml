name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      hardening:
        description: "Headers de seguranca extras (false = relatorio ANTES, true = DEPOIS)"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: read

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Os testes de integracao usam Testcontainers (Docker ja vem no runner)
      - name: Build e testes
        run: mvn -B verify

  zap-scan:
    name: Scan de seguranca (OWASP ZAP)
    needs: build-test
    runs-on: ubuntu-latest
    env:
      HARDENING_ENABLED: ${{ inputs.hardening || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Gerar .env efemero
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -base64 48)"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            # Limites altos so durante o scan, para o ZAP nao receber 429 o tempo todo
            echo "RATE_LIMIT_GENERAL=100000"
            echo "RATE_LIMIT_AUTH=100000"
            echo "HARDENING_ENABLED=${HARDENING_ENABLED}"
          } > .env

      - name: Subir a API com Docker Compose
        run: docker compose up -d --build

      - name: Esperar a API ficar saudavel
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "API no ar"; exit 0
            fi
            sleep 3
          done
          docker compose logs api
          exit 1

      - name: Criar usuario de teste e obter token
        id: auth
        run: |
          BODY='{"email":"zap@example.com","password":"SenhaForte-12345"}'
          curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' -d "$BODY" > /dev/null
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' -d "$BODY" | jq -r .accessToken)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # Confere, no proprio log, se a configuracao valeu antes de escanear:
      # valor de HARDENING_ENABLED, se o token funciona e quais headers a API envia.
      - name: Diagnostico antes do scan
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          echo "HARDENING_ENABLED nesta execucao: ${HARDENING_ENABLED}"
          echo "HARDENING_ENABLED dentro do container: $(docker compose exec -T api printenv HARDENING_ENABLED)"
          echo
          echo "--- GET /api/me com token (esperado: 200) ---"
          curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer ${TOKEN}" http://localhost:8080/api/me
          echo
          echo "--- GET /api/me sem token (esperado: 401) ---"
          curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/api/me
          echo
          echo "--- Headers de resposta de /api/me ---"
          curl -s -D - -o /dev/null -H "Authorization: Bearer ${TOKEN}" http://localhost:8080/api/me
          echo "--- Headers de resposta de /actuator/health ---"
          curl -s -D - -o /dev/null http://localhost:8080/actuator/health

      # O container do ZAP precisa conseguir gravar os relatorios no workspace
      - name: Permissao para os relatorios
        run: chmod -R a+rwx "$GITHUB_WORKSPACE"

      # ZAP rodado direto no Docker (em vez da action) para controlar o header de autenticacao.
      # ZAP_AUTH_HEADER_VALUE faz o ZAP enviar "Authorization: Bearer <token>" em todas as requisicoes.
      - name: OWASP ZAP API scan
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE":/zap/wrk/:rw \
            -e ZAP_AUTH_HEADER_VALUE="Bearer ${TOKEN}" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t http://localhost:8080/v3/api-docs -f openapi \
              -r report_html.html -J report_json.json -w report_md.md \
              -I

      - name: Guardar relatorios do ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-hardening-${{ env.HARDENING_ENABLED }}
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn

      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v