spring:
  application:
    name: gastos-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expenses}
    username: ${DB_USER:expenses}
    password: ${DB_PASSWORD:expenses}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-ttl-minutes: 15
  refresh-ttl-days: 7

rate-limit:
  general-per-minute: ${RATE_LIMIT_GENERAL:60}
  auth-per-minute: ${RATE_LIMIT_AUTH:10}

app:
  hardening:
    enabled: ${HARDENING_ENABLED:true}
